<svg xmlns="http://www.w3.org/2000/svg" width="880" height="260" viewBox="0 0 880 260" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111218" />
      <stop offset="55%" stop-color="#0B0C10" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="chromeText" x1="0" y1="74" x2="0" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="12%" stop-color="#FFFFFF" />
      <stop offset="58%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#838894" />
    </linearGradient>

    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="48%" stop-color="#a1a1aa" />
      <stop offset="72%" stop-color="#f4f4f5" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>

    <radialGradient id="discGlow" cx="720" cy="130" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="55%" stop-color="#A1A1AA" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#07080B" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="878" height="258" rx="18" />
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sweep { animation: lightSweep 7s ease-in-out infinite; }
      @keyframes lightSweep {
        0%, 60% { transform: translateX(-900px) skewX(-22deg); }
        100% { transform: translateX(1100px) skewX(-22deg); }
      }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="878" height="258" rx="18" fill="url(#bg)" />
    <circle cx="720" cy="130" r="120" fill="url(#discGlow)" />

    
    <rect class="sweep" x="0" y="0" width="220" height="260" fill="url(#shine)" />

    
    <text x="48" y="56" fill="#71717A" font-size="11" letter-spacing="2.2" class="mono">WINDOWS UTILITIES  ·  NATIVE .NET</text>
    <text x="46" y="112" fill="url(#chromeText)" font-size="44" font-weight="700" letter-spacing="-1.6" class="sans">9headache.</text>
    <text x="48" y="148" fill="#A1A1AA" font-size="15" class="sans">Designing &amp; building minimal, zero-bloat Windows tools</text>
    <text x="48" y="170" fill="#A1A1AA" font-size="15" class="sans">in C# &amp; .NET. Creator of LyricalWidget.</text>

    <line x1="48" y1="198" x2="535" y2="198" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" />
    <text x="48" y="224" fill="#8E8E98" font-size="11.5" letter-spacing="0.8" class="mono">C# / .NET 10 WPF   /   PYTHON   /   SQL   /   WEB</text>

    
    <circle cx="720" cy="130" r="94" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
    <circle cx="720" cy="130" r="80" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />
    <circle cx="720" cy="130" r="66" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

    
    <g transform="translate(658.4, 68.4) scale(3.85)">
      <circle cx="16" cy="16" r="13.5" fill="#09090b" stroke="url(#cg)" stroke-width="2" />
      <circle cx="16" cy="16" r="9.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.9" />
      <rect x="11" y="13" width="2.2" height="6" rx="1.1" fill="url(#cg)" />
      <rect x="14.9" y="9.5" width="2.2" height="13" rx="1.1" fill="url(#cg)" />
      <rect x="18.8" y="11.5" width="2.2" height="9" rx="1.1" fill="url(#cg)" />
    </g>
  </g>

  <rect x="1" y="1" width="878" height="258" rx="18" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="1" />
</svg>
