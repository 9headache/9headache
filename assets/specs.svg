<svg xmlns="http://www.w3.org/2000/svg" width="880" height="148" viewBox="0 0 880 148" fill="none">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111218" />
      <stop offset="100%" stop-color="#08090D" />
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  
  <rect x="1" y="1" width="282" height="146" rx="14" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" />
  <text x="22" y="34" fill="#71717A" font-size="10" letter-spacing="1.8" class="mono">01 / PERFORMANCE</text>
  <text x="22" y="64" fill="#F5F5F7" font-size="17" font-weight="600" class="sans">Zero-Bloat Native</text>
  <text x="22" y="90" fill="#A1A1AA" font-size="12.5" class="sans">Lightweight desktop utilities built</text>
  <text x="22" y="110" fill="#A1A1AA" font-size="12.5" class="sans">to stay quiet behind games &amp; apps.</text>

  
  <rect x="299" y="1" width="282" height="146" rx="14" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" />
  <text x="320" y="34" fill="#71717A" font-size="10" letter-spacing="1.8" class="mono">02 / AESTHETIC</text>
  <text x="320" y="64" fill="#F5F5F7" font-size="17" font-weight="600" class="sans">Dark-Studio Craft</text>
  <text x="320" y="90" fill="#A1A1AA" font-size="12.5" class="sans">Brushed chrome, obsidian glass,</text>
  <text x="320" y="110" fill="#A1A1AA" font-size="12.5" class="sans">and tactile motion over clutter.</text>

  
  <rect x="597" y="1" width="282" height="146" rx="14" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" />
  <text x="618" y="34" fill="#71717A" font-size="10" letter-spacing="1.8" class="mono">03 / ROADMAP</text>
  <text x="618" y="64" fill="#F5F5F7" font-size="17" font-weight="600" class="sans">Shipping in Public</text>
  <text x="618" y="90" fill="#A1A1AA" font-size="12.5" class="sans">Polishing UI in v2.2 before 3D &amp;</text>
  <text x="618" y="110" fill="#A1A1AA" font-size="12.5" class="sans">ambient border glow in v3.0.</text>
</svg>
